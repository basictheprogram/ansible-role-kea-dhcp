---
name: molecule

"on":
  push:
    branches:
      - "main"
      - "master"
  pull_request:
    branches:
      - "main"
      - "master"

jobs:
  molecule:
    name: "Molecule / ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu2604
            image: geerlingguy/docker-ubuntu2604-ansible:latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Molecule and dependencies
        run: |
          pip install \
            ansible-core \
            molecule \
            molecule-plugins[docker] \
            pytest-testinfra \
            PyYAML

      - name: Run Molecule tests (all scenarios)
        run: molecule test --all
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_IMAGE: ${{ matrix.image }}
