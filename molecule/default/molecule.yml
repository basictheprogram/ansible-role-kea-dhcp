---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: "kea-dhcp-{{ lookup('env', 'MOLECULE_DISTRO') | default('resolute', true) }}"
    image: "{{ lookup('env', 'MOLECULE_IMAGE') | default('ubuntu:26.04', true) }}"
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible
