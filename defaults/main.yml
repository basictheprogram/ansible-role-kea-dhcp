---
#
# Service flags — enable only the services you need.
#
kea_dhcp4_enabled: true
kea_dhcp6_enabled: false
kea_ctrl_agent_enabled: false
kea_ddns_enabled: false

# Set to false to deploy configuration files and install packages without
# starting or enabling any Kea systemd services.  Useful for testing file
# deployments on hosts where Kea should not answer DHCP requests yet.
kea_service_manage: true

#
# Directory layout
#
# kea_base_dir   — Kea configuration files (kea-dhcp4.conf, etc.)
# kea_lease_dir  — Persistent lease files
# kea_log_dir    — Kea log files
#
kea_base_dir: "/etc/kea"
kea_lease_dir: "/var/lib/kea"
kea_log_dir: "/var/log/kea"

#
# Interfaces
#
# It is strongly recommended to name the interface explicitly rather than
# relying on the wildcard.  Set kea_dhcp_interfaces in host_vars or
# group_vars; override the per-protocol variables only when dhcp4 and dhcp6
# should listen on different interfaces.
#
kea_dhcp_interfaces: ["*"]
kea_dhcp4_interfaces: "{{ kea_dhcp_interfaces }}"
kea_dhcp6_interfaces: "{{ kea_dhcp_interfaces }}"

#
# Multi-threading
#
# https://kea.readthedocs.io/en/latest/arm/dhcp4-srv.html#multi-threading-settings-with-different-database-backends
#
kea_dhcp_multi_threading_enable: true
kea_dhcp4_multi_threading_enable: "{{ kea_dhcp_multi_threading_enable }}"
kea_dhcp6_multi_threading_enable: "{{ kea_dhcp_multi_threading_enable }}"

kea_dhcp4_multi_threading_pool_size: >-
  {{ (ansible_facts['processor_vcpus'] if ansible_facts['processor_vcpus'] < 8 else 8) | int }}
kea_dhcp6_multi_threading_pool_size: >-
  {{ (ansible_facts['processor_vcpus'] if ansible_facts['processor_vcpus'] < 6 else 6) | int }}

kea_dhcp4_multi_threading_queue_size: "{{ (kea_dhcp4_multi_threading_pool_size | int * 7) | int }}"
kea_dhcp6_multi_threading_queue_size: "{{ (kea_dhcp6_multi_threading_pool_size | int * 150) | int }}"

#
# Lease timers and limits
#
kea_dhcp_parked_packet_limit: 128
kea_dhcp4_parked_packet_limit: "{{ kea_dhcp_parked_packet_limit }}"
kea_dhcp6_parked_packet_limit: "{{ kea_dhcp_parked_packet_limit }}"

kea_dhcp_valid_lifetime: 6000
kea_dhcp4_valid_lifetime: "{{ kea_dhcp_valid_lifetime }}"
kea_dhcp6_valid_lifetime: "{{ kea_dhcp_valid_lifetime }}"

kea_dhcp_renew_timer: "{{ (kea_dhcp_valid_lifetime | float * 0.5) | int }}"
kea_dhcp4_renew_timer: "{{ kea_dhcp_renew_timer }}"
kea_dhcp6_renew_timer: "{{ kea_dhcp_renew_timer }}"

kea_dhcp_rebind_timer: "{{ (kea_dhcp_valid_lifetime | float * 0.85) | int }}"
kea_dhcp4_rebind_timer: "{{ kea_dhcp_rebind_timer }}"
kea_dhcp6_rebind_timer: "{{ kea_dhcp_rebind_timer }}"

#
# Subnets
#
# Define subnets in host_vars or group_vars.  See README for the entry format.
#
kea_dhcp4_subnets: []
kea_dhcp6_subnets: []

#
# Control Agent
#
kea_ctrl_agent_host: "0.0.0.0"
kea_ctrl_agent_port: 8000

#
# DDNS
#
# kea_ddns_host / kea_ddns_port configure the D2 server address that
# kea-dhcp4 and kea-dhcp6 forward DDNS update requests to.
#
kea_ddns_host: "127.0.0.1"
kea_ddns_port: 53001

# TSIG keys, forward zones, and reverse zones — define in host_vars.
kea_tsig_keys: []
kea_forward_ddns: []
kea_reverse_ddns: []

# BIND9 key discovery
#
# kea_bind9_keys_host — hostname or IP of the BIND9 server to fetch TSIG
#   keys from.  Leave empty ("") when BIND9 runs on the same host as Kea.
#   When set, the find and slurp steps in key_management.yml are delegated
#   to that host.
#
# kea_bind9_keys_path — directory to search for *.key files on the BIND9
#   host.  rndc.key is always excluded.
kea_bind9_keys_host: ""
kea_bind9_keys_path: "/etc/bind"

#
# Logging
#
# NOTE: !unsafe required to prevent Ansible interpreting {%
kea_logging_pattern: !unsafe "%D{%Y-%m-%d %H:%M:%S.%q} %-5p [%c/%i.%t] %m\n"
kea_logging_severity: "INFO"
kea_logging_debuglevel: 0
kea_logging_maxsize: 10485760  # 10 MB
kea_logging_maxver: 3

kea_logging_raw_dhcp4:
  - name: "kea-dhcp4"
    severity: "{{ kea_logging_severity }}"
    debuglevel: "{{ kea_logging_debuglevel }}"
    output_options:
      - output: "{{ kea_log_dir }}/kea-dhcp4.log"
        pattern: "{{ kea_logging_pattern }}"
        maxsize: "{{ kea_logging_maxsize }}"
        maxver: "{{ kea_logging_maxver }}"

kea_logging_raw_dhcp6:
  - name: "kea-dhcp6"
    severity: "{{ kea_logging_severity }}"
    debuglevel: "{{ kea_logging_debuglevel }}"
    output_options:
      - output: "{{ kea_log_dir }}/kea-dhcp6.log"
        pattern: "{{ kea_logging_pattern }}"
        maxsize: "{{ kea_logging_maxsize }}"
        maxver: "{{ kea_logging_maxver }}"

kea_logging_raw_ctrl_agent:
  - name: "kea-ctrl-agent"
    severity: "{{ kea_logging_severity }}"
    debuglevel: "{{ kea_logging_debuglevel }}"
    output_options:
      - output: "{{ kea_log_dir }}/kea-ctrl-agent.log"
        pattern: "{{ kea_logging_pattern }}"
        maxsize: "{{ kea_logging_maxsize }}"
        maxver: "{{ kea_logging_maxver }}"

kea_logging_raw_ddns:
  - name: "kea-dhcp-ddns"
    severity: "{{ kea_logging_severity }}"
    debuglevel: "{{ kea_logging_debuglevel }}"
    output_options:
      - output: "{{ kea_log_dir }}/kea-dhcp-ddns.log"
        pattern: "{{ kea_logging_pattern }}"
        maxsize: "{{ kea_logging_maxsize }}"
        maxver: "{{ kea_logging_maxver }}"

#
# Raw / pass-through options
#
# For any Kea setting not covered by a dedicated variable, pass a dict
# directly into the rendered config via these variables.  Keys and values
# are written verbatim into the appropriate config section via to_nice_json.
#
kea_dhcp4_raw_options: {}
kea_dhcp6_raw_options: {}
kea_ctrl_agent_raw_options: {}
