---
- name: Pre-flight checks
  ansible.builtin.include_tasks: pre-flight.yml
  tags: always

- name: Install kea-common package
  ansible.builtin.apt:
    name: kea-common
    state: present
    update_cache: true

- name: Create Kea base configuration directory
  ansible.builtin.file:
    path: "{{ kea_base_dir }}"
    state: directory
    owner: root
    group: _kea
    mode: "0755"

- name: Create Kea lease directory
  ansible.builtin.file:
    path: "{{ kea_lease_dir }}"
    state: directory
    owner: _kea
    group: _kea
    mode: "0750"

- name: Create Kea log directory
  ansible.builtin.file:
    path: "{{ kea_log_dir }}"
    state: directory
    owner: _kea
    group: _kea
    mode: "0750"

- name: Deploy DHCPv4 service
  ansible.builtin.include_tasks: deploy_dhcp.yml
  vars:
    dhcp_ip_version: "4"
  when: kea_dhcp4_enabled | bool

- name: Deploy DHCPv6 service
  ansible.builtin.include_tasks: deploy_dhcp.yml
  vars:
    dhcp_ip_version: "6"
  when: kea_dhcp6_enabled | bool

- name: Deploy Control Agent service
  when: kea_ctrl_agent_enabled | bool
  block:
    - name: Install kea-ctrl-agent package
      ansible.builtin.apt:
        name: kea-ctrl-agent
        state: present

    - name: Render kea-ctrl-agent configuration
      ansible.builtin.template:
        src: ctrl-agent.json.j2
        dest: "{{ kea_base_dir }}/kea-ctrl-agent.conf"
        owner: root
        group: _kea
        mode: "0640"
      notify: Reload kea-ctrl-agent

    - name: Manage kea-ctrl-agent service state
      ansible.builtin.systemd:
        name: kea-ctrl-agent
        state: "{{ 'started' if kea_service_manage | bool else 'stopped' }}"
        enabled: "{{ kea_service_manage | bool }}"
        daemon_reload: true

- name: Manage TSIG keys for DDNS
  ansible.builtin.include_tasks: key_management.yml
  when: kea_ddns_enabled | bool

- name: Deploy DDNS service
  ansible.builtin.include_tasks: deploy_ddns.yml
  when: kea_ddns_enabled | bool
