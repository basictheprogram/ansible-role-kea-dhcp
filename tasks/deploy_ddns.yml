---
# Runs after key_management.yml (see tasks/main.yml), so kea_tsig_keys
# reflects both manually-defined and auto-discovered keys by this point.
- name: Assert every DDNS zone key-name exists in kea_tsig_keys
  ansible.builtin.assert:
    quiet: true
    that:
      - item['key-name'] in (kea_tsig_keys | map(attribute='name') | list)
    fail_msg: >-
      DDNS zone {{ item.name }} references key-name '{{ item['key-name'] }}',
      which is not present in kea_tsig_keys (manually defined or
      auto-discovered from kea_bind9_keys_path).
      Known key names: {{ kea_tsig_keys | map(attribute='name') | list }}.
  loop: "{{ kea_forward_ddns + kea_reverse_ddns }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"

- name: Install kea-dhcp-ddns-server package
  ansible.builtin.apt:
    name: kea-dhcp-ddns-server
    state: present

# Ubuntu LP #2121327 — the shipped AppArmor profile for kea-dhcp-ddns is
# missing permissions for both the log file and its lock file.  Apply a
# local override so the denials do not appear in dmesg.  This file is
# included by the main profile and is preserved across package upgrades.
# Only relevant on hosts that actually have AppArmor installed — some
# minimal images don't ship apparmor_parser at all, in which case there is
# no profile to override.
- name: Check whether AppArmor is present
  ansible.builtin.stat:
    path: /usr/sbin/apparmor_parser
  register: _kea_apparmor_parser

- name: "Apply AppArmor local override for kea-dhcp-ddns log files (LP #2121327)"
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.sbin.kea-dhcp-ddns
    content: |
      # Site-local additions — workaround for LP #2121327
      # Missing permissions for log file and lock file in shipped profile
      # (isc-kea 3.0.3-1).  Remove this file once the upstream package is fixed.
      /var/log/kea/kea-dhcp-ddns.log rw,
      /var/log/kea/kea-dhcp-ddns.log.lock rwk,
    owner: root
    group: root
    mode: "0644"
  notify: Reload kea-dhcp-ddns AppArmor profile
  when: _kea_apparmor_parser.stat.exists

- name: Render kea-dhcp-ddns configuration
  ansible.builtin.template:
    src: ddns.json.j2
    dest: "{{ kea_base_dir }}/kea-dhcp-ddns.conf"
    owner: root
    group: _kea
    mode: "0640"
  notify: Reload kea-dhcp-ddns-server

- name: Validate rendered kea-dhcp-ddns configuration
  ansible.builtin.command:
    cmd: "kea-dhcp-ddns -t {{ kea_base_dir }}/kea-dhcp-ddns.conf"
  register: _kea_ddns_validate_result
  changed_when: false
  failed_when: _kea_ddns_validate_result.rc != 0

- name: Manage kea-dhcp-ddns-server service state
  ansible.builtin.systemd:
    name: kea-dhcp-ddns-server
    state: "{{ 'started' if kea_service_manage | bool else 'stopped' }}"
    enabled: "{{ kea_service_manage | bool }}"
    daemon_reload: true
