---
- name: Install kea-dhcp-ddns-server package
  ansible.builtin.apt:
    name: kea-dhcp-ddns-server
    state: present

# Ubuntu LP #2121327 — the shipped AppArmor profile for kea-dhcp-ddns is
# missing permissions for both the log file and its lock file.  Apply a
# local override so the denials do not appear in dmesg.  This file is
# included by the main profile and is preserved across package upgrades.
- name: "Apply AppArmor local override for kea-dhcp-ddns log files (LP #2121327)"
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.sbin.kea-dhcp-ddns
    content: |
      # Site-local additions — workaround for LP #2121327
      # Missing permissions for log file and lock file in shipped profile
      # (isc-kea 3.0.3-1).  Remove this file once the upstream package is fixed.
      /var/log/kea/kea-dhcp-ddns.log rw,
      /var/log/kea/kea-dhcp-ddns.log.lock rwk,
    owner: root
    group: root
    mode: "0644"
  notify: Reload kea-dhcp-ddns AppArmor profile

- name: Render kea-dhcp-ddns configuration
  ansible.builtin.template:
    src: ddns.json.j2
    dest: "{{ kea_base_dir }}/kea-dhcp-ddns.conf"
    owner: root
    group: _kea
    mode: "0640"
  notify: Reload kea-dhcp-ddns-server

- name: Manage kea-dhcp-ddns-server service state
  ansible.builtin.systemd:
    name: kea-dhcp-ddns-server
    state: "{{ 'started' if kea_service_manage | bool else 'stopped' }}"
    enabled: "{{ kea_service_manage | bool }}"
    daemon_reload: true
